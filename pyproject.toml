# Packaging and building Python projects with uv
[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

# https://docs.astral.sh/uv/concepts/build-backend/
[tool.uv.build-backend]
module-name = "featurebyte"
module-root = ""

# https://docs.astral.sh/uv/concepts/metadata/
# Metadata for the package.
# Add to the dependencies to include them in the distribution.
[project]
authors = [{name = "FeatureByte", email = "it-admin@featurebyte.com"}]
name = "featurebyte"
version = "3.4.3"
description = "Python Library for FeatureOps"
readme = "README.md"
requires-python = ">=3.10"
repository = "https://github.com/featurebyte/featurebyte"
documentation = "https://docs.featurebyte.com"
homepage = "https://featurebyte.com"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = { file = "LICENSE" }
dependencies = [
  "aiofiles>=24",
  "alive-progress>=3",
  "black>=26.3.1,<27",
  "cachetools>=5",
  "croniter>=5",
  "cryptography>=50",
  "grapheme>=0.6",
  "humanize>=4",
  "importlib-metadata>=8",
  "jinja2>=3",
  "lazy-object-proxy>=1",
  "numpy",
  "orjson>=3.11.6,<4",
  "pandas>=2",
  "pillow>=12.3.0,<13",
  "pyarrow>=23.0.1",
  "pydantic-extra-types>=2",
  "pydantic-settings>=2",
  "pydantic~=2.8",
  "pymongo>=4",
  "pyopenssl>=26",
  "python-multipart>=0.0.30,<1",
  "python-on-whales",
  "pyyaml>=5",
  "requests>=2.33.0,<3",
  "rich>=13",
  "sqlglot~=25.0", # Breaking change
  "typeguard>=4",
  "typer",
  "websocket-client>=1",
]

[project.optional-dependencies]
server = [
  "aioboto3",
  "asyncache",
  "celery[redis]",
  "celerybeat-mongo",
  "databricks-sdk",
  "databricks-sql-connector~=4.0.0",
  "fastapi",
  "feast[snowflake,redis,mysql,gcp]==0.66.0",
  "featurebyte-freeware",
  "gevent",
  "google-cloud-bigquery",
  "google-cloud-bigquery-storage",
  "motor",
  "weasyprint",
  "pyhive[hive_pure_sasl]",
  "redis",
  "requests-kerberos",
  "smart-open[azure,gcs]",
  "snowflake-connector-python",
  "thrift-sasl",
  "uvicorn[standard]"
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "docs" },
  "pre-commit",
]
test = [
  "freezegun",
  "junitparser",
  "jupyterlab>=4.6.2,<5",
  "mongomock-motor",
  "mongomock==4.1.2",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-order",
  "pytest-rerunfailures",
  "pytest-split",
  "pytest-timeout",
  "pytest-xdist",
]
docs = [
  "docstring-parser",
  "mkautodoc",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-enumerate-headings-plugin",
  "mkdocs-gen-files",
  "mkdocs-git-authors-plugin",
  "mkdocs-git-revision-date-localized-plugin",
  "mkdocs-jupyter",
  "mkdocs-literate-nav",
  "mkdocs-minify-plugin",
  "mkdocs-print-site-plugin",
  "mkdocs-section-index",
  "mkdocs-table-reader-plugin",
  "mkdocs==1.5.3", # Failed to compile docs
]
lint = [
  "bandit",
  "cyclonedx-bom>=6",
  "darglint",
  "mypy-extensions",
  "mypy==1.0.1",
  "pip-audit",
  "pip-licenses",
  "ruff",
  "toml-sort",
  "types-Markdown",
  "types-PyYAML",
  "types-aiofiles",
  "types-backports",
  "types-cachetools",
  "types-chardet",
  "types-croniter",
  "types-cryptography",
  "types-decorator",
  "types-paramiko",
  "types-protobuf",
  "types-pyOpenSSL",
  "types-pycurl",
  "types-pymysql==1.1.0.20250822", # Linting error: featurebyte/feast/online_store/mysql.py:48:13: error: _C? has no attribute "execute"  [attr-defined]
  "types-python-dateutil",
  "types-pytz",
  "types-redis",
  "types-requests",
  "types-setuptools",
  "types-simplejson",
  "types-six",
  "types-toml",
  "types-typed-ast",
  "types-tzlocal",
  "types-ujson",
  "types-urllib3",
  "typing-extensions",
]

# Minimum version bounds for transitive dependencies with known vulnerabilities.
# Add entries here when a vuln cannot be fixed by bumping a direct dependency.
# Remove entries once the upstream dep that pulls them in is upgraded.
[tool.uv]
constraint-dependencies = [
  "aiohttp>=3.14.1,<4",
  "azure-core>=1.38.0,<2",
  "click>=8.3.3,<9",
  "filelock>=3.20.3,<4",
  "fonttools>=4.60.2,<5",
  "gitpython>=3.1.59,<4",
  "idna>=3.15,<4",
  "jupyter-server>=2.20.0,<3",
  "lxml>=6.1.0,<7",
  "mistune>=3.3.0,<4",
  "msgpack>=1.2.1,<2",
  "nbconvert>=7.17.1,<8",
  "pip>=26.1.2,<27",
  "protobuf>=5.29.6,<6",
  "pyasn1>=0.6.4,<1",
  "pygments>=2.20.0,<3",
  "pyjwt>=2.13.0,<3",
  "pymdown-extensions>=11.0.1,<12",
  "python-dotenv>=1.2.2,<2",
  "setuptools<82", # >=82 drops pkg_resources, needed by mongomock==4.1.2 (test dep); CVE fix needs >=83, so unfixable without a mongomock upgrade
  "snowflake-connector-python>=4.7.2,<5",
  "soupsieve>=2.8.4,<3",
  "tornado>=6.5.8,<7",
  "urllib3>=2.7.0,<3",
  "virtualenv>=20.36.1,<21",
  "weasyprint>=68.0,<69", # GHSA-jhhc-3hcp-qhm5 (CSS injection) unfixed upstream; not exploitable here - our only call site (featurebyte/routes/feature_job_setting_analysis/controller.py) never sets presentational_hints=True (default False), which the advisory requires
]
# Drops rfc3987 (GPLv3+, pulled in via feast's jsonschema[format] requirement)
# from the resolved graph entirely. See OSS_POLICY.md ("Resolved findings")
# for the full rationale and verification.
override-dependencies = [
  "jsonschema==4.26.0",
]

# Packaging source metadata, this points to the source code repository.
#     Use UV_INDEX_FEATUREBYTE_NP_USERNAME=_json_key_base64
#     and UV_INDEX_FEATUREBYTE_NP_PASSWORD={base64 encoded service account key}
[[tool.uv.index]]
name = "featurebyte_np"
url = "https://us-central1-python.pkg.dev/vpc-host-nonprod-xa739-xz970/featurebyte-pypi/simple/"
publish-url = "https://us-central1-python.pkg.dev/vpc-host-nonprod-xa739-xz970/featurebyte-pypi/"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-v", "--doctest-modules", "--durations=50", "--doctest-continue-on-failure", "--ignore-glob=tests/fixtures/*"] # Extra options:
doctest_optionflags = ["NUMBER", "NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]
filterwarnings = [
  "ignore::Warning:pkg_resources",
  "ignore::Warning:mongomock",
]
markers = [
  "disable_task_manager_mock: disable use of autouse task manager fixture",
  "no_mock_websocket_client: skip mocking websocket client",
  "no_mock_api_client: skip mocking api client",
]
norecursedirs = ["hooks", "*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]

[tool.ruff]
preview = true
extend-exclude = ["scripts", "hive-udf", "docs", "docker", "assets", ".task", ".mypy_cache", "site", "tests/fixtures", "docs/notebooks/"]
line-length = 100
indent-width = 4
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E1", "E4", "E7", "E9", "F", "I"]  # Rules to use by default. Consider adding "UP" for upgradability checks.
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E722"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.bandit]
skips = ["B608"]

[tool.mypy]  # https://mypy.readthedocs.io/en/latest/config_file.html#using-a-pyproject-toml-file
allow_redefinition = false
check_untyped_defs = true
color_output = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = false
disallow_untyped_defs = true
exclude = ['tests', 'docs', 'docker', '.github', 'featurebyte/api/templates', 'notebooks/prebuilt_catalogs.py']
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
pretty = true
python_version = "3.10"
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

# feast requires starlette>=1.0.1, whose Request.state uses a TypeVar default (PEP 696) that
# mypy 1.0.1 cannot parse. This surfaces as spurious "StateT? has no attribute ..." [attr-defined]
# errors on every `request.state.app_container`/`request.state.user` access, not real bugs -
# upgrading mypy resolves it cleanly, but until then, silence attr-defined specifically in the
# modules that hit this pattern rather than disabling it project-wide.
[[tool.mypy.overrides]]
module = [
  "featurebyte.app",
  "featurebyte.middleware",
  "featurebyte.routes.base_router",
  "featurebyte.routes.base_materialized_table_router",
  "featurebyte.routes.*.api",
]
disable_error_code = ["attr-defined"]
