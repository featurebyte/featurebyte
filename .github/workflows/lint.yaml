name: lint
'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
permissions: read-all
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version:
          - 3.11.18
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.x
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install packages needed for build
        run: |-
          sudo apt-get update
          sudo apt-get install libkrb5-dev libsasl2-dev libpython3-dev g++ gcc
      - name: Lint Checks
        run: task lint:pr
      - name: pip-audit check [ONLY MAIN]
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: task lint:safety
      - name: Generate SBOM and third-party notices [ONLY MAIN]
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |-
          task lint:sbom
          task lint:notice
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: oss-compliance-artifacts
          path: |
            sbom.json
            THIRD-PARTY-NOTICES.txt
          retention-days: 90
  teams:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - lint
    steps:
      - uses: actions/checkout@v7
        with:
          repository: featurebyte/actions
          ref: v1
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          path: .actions
          persist-credentials: false
      - uses: ./.actions/notify-teams
        with:
          webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          results: |-
            lint: [${{ needs.lint.result }}]
