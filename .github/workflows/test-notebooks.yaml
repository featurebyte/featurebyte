name: test-notebooks
'on':
  workflow_dispatch: { }
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - stable/*
      - release/*
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref }}"
  cancel-in-progress: true
jobs:
  test-deep-dive-notebooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - 3.11.18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.x
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install packages needed for build
        run: |-
          sudo apt-get update
          sudo apt-get install libkrb5-dev libsasl2-dev libpython3-dev g++ gcc
      - name: Set Github Committer Settings
        run: |-
          git config --global user.name "featurebyte[bot]"
          git config --global user.email "featurebyte[bot]@users.noreply.github.com"
      - name: Run task install
        run: task install
      - name: Build docker image
        run: task docker-build
      - name: Retag docker image
        run: docker tag featurebyte-server:latest "featurebyte/featurebyte-server:$(uv version --short)"
      - name: Run notebook tests
        run: task test-deep-dive-notebooks
    timeout-minutes: 30
  test-quick-start-notebooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - 3.11.18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.x
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install packages needed for build
        run: |-
          sudo apt-get update
          sudo apt-get install libkrb5-dev libsasl2-dev libpython3-dev g++ gcc
      - name: Set Github Committer Settings
        run: |-
          git config --global user.name "featurebyte[bot]"
          git config --global user.email "featurebyte[bot]@users.noreply.github.com"
      - name: Run task install
        run: task install
      - name: Build docker image
        run: task docker-build
      - name: Retag docker image
        run: docker tag featurebyte-server:latest "featurebyte/featurebyte-server:$(uv version --short)"
      - name: Run notebook tests
        run: task test-quick-start-notebooks
    timeout-minutes: 45
  test-playground-notebooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - 3.11.18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.x
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install packages needed for build
        run: |-
          sudo apt-get update
          sudo apt-get install libkrb5-dev libsasl2-dev libpython3-dev g++ gcc
      - name: Set Github Committer Settings
        run: |-
          git config --global user.name "featurebyte[bot]"
          git config --global user.email "featurebyte[bot]@users.noreply.github.com"
      - name: Run task install
        run: task install
      - name: Build docker image
        run: task docker-build
      - name: Retag docker image
        run: docker tag featurebyte-server:latest "featurebyte/featurebyte-server:$(uv version --short)"
      - name: Run notebook tests
        run: task test-playground-notebooks
    timeout-minutes: 45
  teams:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - test-quick-start-notebooks
      - test-deep-dive-notebooks
      - test-playground-notebooks
    steps:
      - uses: actions/checkout@v7
        with:
          repository: featurebyte/actions
          ref: v1
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          path: .actions
          persist-credentials: false
      - uses: ./.actions/notify-teams
        with:
          webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          results: |-
            test-quick-start-notebooks: [${{ needs.test-quick-start-notebooks.result }}]
            test-deep-dive-notebooks:   [${{ needs.test-deep-dive-notebooks.result }}]
            test-playground-notebooks:  [${{ needs.test-playground-notebooks.result }}]
