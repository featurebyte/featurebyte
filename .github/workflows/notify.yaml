name: notify
'on':
  pull_request:
    types:
    - closed
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  slack:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'breaking') }}
    steps:
    - uses: actions/checkout@v7
    - env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_OAUTH }}
      name: Send Slack notification to user-experience channel
      uses: slackapi/slack-github-action@v4.0.0
      with:
        method: chat.postMessage
        token: ${{ secrets.SLACK_OAUTH }}
        payload: |
          channel: C042PLEC8D9
          text: "${{ github.event.repository.name }} Breaking changes -- ${{ github.event.pull_request.title }} [#${{ github.event.number }}]"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "`${{ github.event.repository.name }}` Breaking changes -- ${{ github.event.pull_request.title }} [#${{ github.event.number }}]"
            - type: section
              text:
                type: mrkdwn
                text: "Actor: ${{ github.actor }}"
            - type: section
              text:
                type: mrkdwn
                text: "Changes: ${{ github.event.pull_request._links.html.href }}/files"
  teams:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'breaking') }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: featurebyte/actions
        ref: v1
        ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        path: .actions
        persist-credentials: false
    - uses: ./.actions/notify-teams
      with:
        webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
        text: |-
          `${{ github.event.repository.name }}` Breaking changes -- ${{ github.event.pull_request.title }} [#${{ github.event.number }}]
          Actor: ${{ github.actor }}
          Changes: ${{ github.event.pull_request._links.html.href }}/files
