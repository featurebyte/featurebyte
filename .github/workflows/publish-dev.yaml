name: publish
'on':
  workflow_dispatch: {}
  push:
    branches:
      - main            # Allow main branch           --> X.Y.Z.devN
      - post-release/*  # Allow post-release branches --> X.Y.Z.postN
      - stable/*        # Allow stable branches       --> X.Y.Z.postN
permissions:
  contents: write
  id-token: write
env:
  CODEARTIFACT_DOMAIN: featurebyte
  CODEARTIFACT_DOMAIN_OWNER: "972678707440"
  CODEARTIFACT_REPOSITORY: featurebyte-pypi
  SERVER_IMAGE_REPO: us-central1-docker.pkg.dev/vpc-host-nonprod-xa739-xz970/docker/featurebyte-server
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  UV_INDEX_FEATUREBYTE_PYPI_USERNAME: aws
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version:
          - 3.11.18
    outputs:
      DEV_VERSION: ${{ steps.get_version.outputs.DEV_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/codeartifact-token
        with:
          role: publish
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.x
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install packages needed for build
        run: |-
          sudo apt-get update
          sudo apt-get install libkrb5-dev libsasl2-dev libpython3-dev g++ gcc
      - name: Run task install
        run: task install
      - name: Get Version to Publish
        id: get_version
        run: |
          export PACKAGE=$(uv version | cut -d ' ' -f1)
          export VERSION=$(uv version --short)
          if [ "$BRANCH_NAME" = "main" ]; then
            export SUFFIX="dev"
          else
            export SUFFIX="post"
          fi
          export DEV_VERSION=$(aws codeartifact list-package-versions --domain "${CODEARTIFACT_DOMAIN}" --domain-owner "${CODEARTIFACT_DOMAIN_OWNER}" --repository "${CODEARTIFACT_REPOSITORY}" --format pypi --package "${PACKAGE}" --query 'versions[].version' --output text | \
            tr '\t' '\n' | \
            sort --version-sort -r | \
            grep -P "${VERSION}.${SUFFIX}" | \
            head -n 1 | \
            grep -oP "\d+$"
          )
          export DEV_VERSION=${DEV_VERSION:-0}  # Set dev version to 0 if not exist
          export DEV_VERSION="$(uv version --short).${SUFFIX}$((DEV_VERSION+=1))"
          echo "DEV_VERSION=${DEV_VERSION}" >> $GITHUB_ENV
          echo "DEV_VERSION=${DEV_VERSION}" >> $GITHUB_OUTPUT
          echo "SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Update Version in pyproject.toml
        run: sed -i -E "s|^version = \"[^\"]+\"|version = \"${{ env.DEV_VERSION }}\"|g" pyproject.toml
      - name: Set Github Committer Settings
        run: |-
          git config --global user.name "featurebyte[bot]"
          git config --global user.email "featurebyte[bot]@users.noreply.github.com"
      - name: Tagging Version in git
        run: |-
          git tag "$(uv version --short)"
          git push origin "$(uv version --short)"
      - name: Replace docker-compose image tag (server)
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '.services.featurebyte-server.image = "${{ env.SERVER_IMAGE_REPO }}:${{ env.DEV_VERSION }}"' featurebyte/docker/featurebyte.yml
      - name: Replace docker-compose image tag (worker)
        uses: mikefarah/yq@master
        with:
          cmd: yq -i '.services.featurebyte-worker.image = "${{ env.SERVER_IMAGE_REPO }}:${{ env.DEV_VERSION }}"' featurebyte/docker/featurebyte.yml
      - name: Publish to the CodeArtifact registry
        run: |-
          uv build
          uv publish --index featurebyte_pypi --username="${UV_INDEX_FEATUREBYTE_PYPI_USERNAME}" --password="${UV_INDEX_FEATUREBYTE_PYPI_PASSWORD}"
  test-install:
    runs-on: ${{ matrix.runner }}
    needs:
      - publish
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - 3.12.4
          - 3.11.9  # Newest 3.11 patch setup-python provides on macOS and Windows
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/codeartifact-token
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install featurebyte
        run: |-
          pip install --extra-index-url="https://aws:${{ env.UV_INDEX_FEATUREBYTE_PYPI_PASSWORD }}@${{ env.CODEARTIFACT_DOMAIN }}-${{ env.CODEARTIFACT_DOMAIN_OWNER }}.d.codeartifact.ap-southeast-1.amazonaws.com/pypi/${{ env.CODEARTIFACT_REPOSITORY }}/simple/" featurebyte==${{ needs.publish.outputs.DEV_VERSION }}
          python -c "import featurebyte; print(featurebyte.version)"
  slack:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set Channel ID
        run: |-
          echo "CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}" >> $GITHUB_ENV
      - name: Load REPOSITORY into env
        run: |
          echo "REPOSITORY=$(echo '${{ github.repository }}' | cut -d / -f2)" >> $GITHUB_ENV
      - name: Send Slack notification with workflow result.
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_OAUTH }}
          payload: |
            channel: ${{ env.CHANNEL_ID }}
            text: "${{ env.REPOSITORY }} [${{ github.workflow }}] [${{ needs.publish.result }} - ${{ needs.publish.outputs.DEV_VERSION }}]"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "`${{ env.REPOSITORY }} [${{ github.workflow }}]`: ${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
              - type: section
                text:
                  type: mrkdwn
                  text: "```publish: [${{ needs.publish.result }} - ${{ needs.publish.outputs.DEV_VERSION }}]```"
