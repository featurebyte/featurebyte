version: '3'

env:
  FEAST_USAGE: False

tasks:
  install:
    desc: "Install the project dependencies"
    run: once
    sources:
      - pyproject.toml
      - uv.lock
    cmds:
      - uv sync --all-groups --all-extras

  default:
    desc: "Run ALL the linter checks."
    deps:
      - task: install
    cmds:
      - task: pr
      - task: safety

  format:
    desc: "Format the code"
    sources:
      - featurebyte/**/*
      - tests/**/*
      - uv.lock
      - pyproject.toml
    deps:
      - task: install
    cmds:
      - task: format:toml
      - task: format:ruff

  format:toml:
    desc: "Format the toml files"
    sources:
      - uv.lock
      - pyproject.toml
    deps:
      - task: install
    cmds:
      - uv run toml-sort --in-place uv.lock

  format:ruff:
    desc: "Format the toml files"
    sources:
      - featurebyte/**/*
      - tests/**/*
    deps:
      - task: install
    cmds:
      - uv run ruff check --select I --diff || uv run ruff check --select I --fix
      - uv run ruff check --diff || uv run ruff check --fix
      - uv run ruff format --diff || uv run ruff format

  pr:
    desc: "Run the linter, but without the vulnerability audit. This is run on every PR. Vulnerability audit will be run on deploy."
    deps:
      - task: install
      - task: import-rules
    cmds:
      - task: style
      - task: type
      - task: bandit
      - task: licenses

  style:
    desc: "Run the linter[style]"
    sources:
      - uv.lock
      - featurebyte/**/*
      - tests/**/*
    cmds:
      - task: style-ruff
      - task: style-darglint
      - uv run toml-sort --check uv.lock

  style-ruff:
    desc: "Run the linter[style] with only ruff"
    sources:
      - featurebyte/**/*
      - tests/**/*
    cmds:
      - uv run ruff check
      - uv run ruff format

  style-darglint:
    desc: "Run the linter[style] with only darglint"
    vars:
      CPU_CORES:
        sh: python -c 'import multiprocessing as mp; print(mp.cpu_count())'
    env:
      DARG_SOURCES:
        sh: |
          echo "$(find featurebyte -type d \( -path featurebyte/routes \) -prune -false -o -name "*.py" ! -path "featurebyte/__main__.py" ! -path "featurebyte/datasets/*" ! -path "featurebyte/conftest.py" | xargs)" "$(find featurebyte -type f \( -path featurebyte/routes \) -o -name "controller.py" | xargs)"
    sources:
      - featurebyte/**/*
      - tests/**/*
    cmds:
      - echo "${DARG_SOURCES}" | xargs -n16 -P {{ .CPU_CORES }} uv run darglint --docstring-style numpy --strictness full -v 2

  type:
    desc: "Run the linter[type]"
    sources:
      - uv.lock
      - pyproject.toml
      - featurebyte/**/*
      - tests/**/*
    cmds:
      - cmd: if [ ! -d .mypy_cache ]; then mkdir .mypy_cache; fi
        silent: true
      - uv run mypy --install-types --non-interactive --config-file pyproject.toml --exclude '(featurebyte/conftest.py|site)' .

  # Findings ignored below fall into two buckets - remove the flag once the blocker
  # or follow-up work is done:
  #   Structurally blocked (no version satisfies the CVE fix *and* another pin):
  #     - cryptography, pyopenssl: fix needs cffi>=2.0 / pyopenssl>=26, both capped by
  #       feast==0.40.1's snowflake-connector-python<4 pin.
  #     - protobuf: capped by feast==0.40.1 (protobuf>=4.24.0,<5.0.0).
  #     - setuptools: fix (>=83) drops pkg_resources, needed by our pinned mongomock==4.1.2
  #       test dep.
  #     - pygments, pymdown-extensions: fix needs pymdown-extensions>=11, which needs
  #       mkdocs-material requiring mkdocs~=1.6, conflicting with our pinned mkdocs==1.5.3
  #       (itself pinned for a "Failed to compile docs" issue).
  #     - weasyprint: PYSEC-2026-3412 has no fixed version published upstream yet.
  #   Fixable independently, but the bump is a major version jump needing a dedicated
  #   testing pass before landing:
  #     - feast: 0.40.1 -> 0.54.0, has known breaking API changes (see comments on the
  #       feast dependency) and a custom monkeypatch module (featurebyte/feast/patch.py).
  #     - starlette: pulled in via fastapi; a compatible fastapi (0.117 -> 0.141) exists.
  #     - pytest: 8.4.2 -> 9.0.3; needs a compat check with our pytest plugins.
  safety:
    desc: "Run the linter[safety]"
    sources:
      - uv.lock
      - pyproject.toml
      - featurebyte/**/*
    cmds:
    - >-
      uv run pip-audit
      --ignore-vuln GHSA-537c-gmf6-5ccf
      --ignore-vuln PYSEC-2026-35
      --ignore-vuln PYSEC-2026-36
      --ignore-vuln PYSEC-2026-2141
      --ignore-vuln PYSEC-2026-3552
      --ignore-vuln PYSEC-2026-3553
      --ignore-vuln PYSEC-2026-3554
      --ignore-vuln PYSEC-2026-2268
      --ignore-vuln PYSEC-2026-2269
      --ignore-vuln PYSEC-2026-1805
      --ignore-vuln PYSEC-2026-3447
      --ignore-vuln PYSEC-2026-2987
      --ignore-vuln CVE-2026-67422
      --ignore-vuln PYSEC-2026-2999
      --ignore-vuln PYSEC-2026-3609
      --ignore-vuln PYSEC-2026-3412
      --ignore-vuln PYSEC-2026-1366
      --ignore-vuln PYSEC-2026-161
      --ignore-vuln PYSEC-2026-248
      --ignore-vuln PYSEC-2026-249
      --ignore-vuln PYSEC-2026-1942
      --ignore-vuln PYSEC-2026-2280
      --ignore-vuln PYSEC-2026-2281
      --ignore-vuln PYSEC-2026-1845

  bandit:
    desc: "Run the linter[bandit]"
    sources:
      - uv.lock
      - pyproject.toml
      - featurebyte/**/*
    cmds:
      - uv run bandit -c pyproject.toml -ll --recursive featurebyte

  licenses:
    desc: "Run the linter[licenses] - fails the build on any non-permissive (e.g. copyleft) dependency license"
    # NOTE: do not filter with `pip-licenses --packages "$(uv export ...)"` - `uv export`
    # emits a leading `-e .` line, and passing the export output as a single quoted
    # string makes `--packages` match zero real packages, so the check silently
    # passes no matter what is installed. Scanning the whole (already `--all-groups
    # --all-extras` synced) environment and explicitly ignoring our own first-party
    # packages avoids that failure mode.
    # NOTE: pip-licenses --allow-only is fail-fast (reports only the first
    # violation per run) - re-run after each fix to confirm nothing else is
    # hiding behind it.
    # NOTE: chardet, gssapi, pyphen are ignored below; rfc3987 was removed
    # entirely (see the override-dependencies comment in pyproject.toml).
    # See OSS_POLICY.md ("Resolved findings") for the full rationale on
    # each - this comment is deliberately just a pointer, not a duplicate,
    # to avoid the two drifting out of sync.
    env:
      PERMISSIVE_LICENSES: |-
        Apache Software License;Apache License 2.0;Apache License, Version 2.0;Apache-2.0;Apache 2.0;BSD;BSD License;BSD-2-Clause;BSD-3-Clause;3-Clause BSD License;BSD 3-Clause License;Historical Permission Notice and Disclaimer (HPND);Historical Permission Notice and Disclaimer;ISC License (ISCL);ISC;MIT;MIT License;MIT-CMU;DFSG approved;MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);Public Domain;Python Software Foundation License;PSF-2.0;The Unlicense (Unlicense);Zope Public License;CNRI-Python;Python-2.0
    sources:
      - uv.lock
      - pyproject.toml
    cmds:
      - uv run pip-licenses --partial-match --ignore-packages featurebyte featurebyte_freeware chardet gssapi pyphen --allow-only="${PERMISSIVE_LICENSES}"

  sbom:
    desc: "Generate a CycloneDX SBOM for the distributed package (runtime + extras, not dev tooling)"
    sources:
      - uv.lock
      - pyproject.toml
    generates:
      - sbom.json
    cmds:
      - uv export --no-dev --all-extras --no-header --no-hashes --no-annotate | grep -v '^-e ' > .sbom-requirements.txt
      - uv run cyclonedx-py requirements .sbom-requirements.txt --output-format json --output-file sbom.json
      - rm -f .sbom-requirements.txt

  notice:
    desc: "Generate THIRD-PARTY-NOTICES.txt attributing dependency licenses (whole synced environment, including dev tooling - over-inclusive is safer than under-inclusive for attribution)"
    sources:
      - uv.lock
      - pyproject.toml
    generates:
      - THIRD-PARTY-NOTICES.txt
    cmds:
      - uv run pip-licenses --with-authors --with-urls --with-license-file --no-license-path --format=plain-vertical --ignore-packages featurebyte featurebyte_freeware --output-file THIRD-PARTY-NOTICES.txt

  import-rules:
    desc: Check for import rule violations
    sources:
      - featurebyte/**/*
      - scripts/enforce_import_rules.py
    cmds:
      - python scripts/enforce_import_rules.py
